<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Wasm M3 deterministic page</title>
<style>
  @font-face {
    font-family: "M3Ahem";
    src: url("data:font/woff2;base64,__M3_AHEM_WOFF2_BASE64__")
      format("woff2");
    font-display: block;
  }

  :root {
    color-scheme: light;
    background: #e9eef5;
    font-family: "M3Ahem", monospace;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 800px;
    height: 600px;
    margin: 0;
    overflow: hidden;
  }

  body {
    padding: 24px;
    background:
      linear-gradient(90deg, #dbe7f5 0 16px, transparent 16px),
      #e9eef5;
    color: #14213d;
  }

  main {
    display: grid;
    grid-template-columns: 340px 340px;
    grid-template-rows: 88px 164px 212px;
    gap: 16px;
    width: 736px;
    height: 536px;
    padding: 16px;
    border: 4px solid #14213d;
    background: #fffaf0;
  }

  .title {
    grid-column: 1 / 3;
    position: relative;
    padding: 12px;
    border: 4px solid #fca311;
    background: #fff;
  }

  h1 {
    margin: 0 0 12px;
    color: #14213d;
    font-size: 24px;
    line-height: 24px;
    letter-spacing: 2px;
  }

  .subtitle {
    margin: 0;
    color: #355070;
    font-size: 12px;
    line-height: 12px;
  }

  .badge {
    position: absolute;
    top: 10px;
    right: 18px;
    width: 52px;
    height: 40px;
    transform: translate(8px, 4px);
    border: 4px solid #14213d;
    background: #2a9d8f;
  }

  .visual,
  .scroll-region,
  .canvas-panel,
  .form-panel {
    border: 4px solid #14213d;
    background: #fff;
  }

  .visual {
    display: grid;
    place-items: center;
    background: #fde2e4;
  }

  .visual img {
    display: block;
    width: 216px;
    height: 112px;
    image-rendering: pixelated;
  }

  .scroll-region {
    height: 100%;
    overflow: auto;
    scrollbar-width: none;
    background: #d8f3dc;
  }

  .scroll-region::-webkit-scrollbar {
    width: 0;
    height: 0;
  }

  .scroll-content {
    height: 360px;
    padding: 12px;
    background:
      linear-gradient(
        #95d5b2 0 72px,
        #52b788 72px 144px,
        #2d6a4f 144px 216px,
        #1b4332 216px 288px,
        #081c15 288px
      );
  }

  .scroll-marker {
    width: 232px;
    height: 36px;
    border: 4px solid #fff;
    background: #40916c;
  }

  .canvas-panel,
  .form-panel {
    padding: 18px;
  }

  .canvas-panel {
    background: #e2eafc;
  }

  #fixture-canvas {
    display: block;
    width: 280px;
    height: 140px;
    margin: 10px auto 0;
    border: 4px solid #14213d;
    image-rendering: pixelated;
  }

  .panel-label {
    margin: 0;
    color: #14213d;
    font-size: 14px;
    line-height: 14px;
  }

  .form-panel {
    background: #faedcd;
  }

  label {
    display: block;
    margin-bottom: 16px;
    color: #14213d;
    font-size: 14px;
    line-height: 14px;
  }

  input,
  button {
    appearance: none;
    display: block;
    width: 100%;
    height: 48px;
    margin: 0 0 16px;
    padding: 10px;
    border: 4px solid #14213d;
    border-radius: 0;
    outline: 0;
    background: #fff;
    color: #14213d;
    caret-color: transparent;
    font: 16px/20px "M3Ahem", monospace;
  }

  button {
    background: #fca311;
  }
</style>
<main aria-label="Chromium Wasm M3 fixture">
  <section class="title">
    <h1>CHROMIUM WASM M3</h1>
    <p class="subtitle">BLINK + V8 + SKIA SOFTWARE FRAME</p>
    <div class="badge" aria-hidden="true"></div>
  </section>

  <section class="visual" aria-label="Inline image">
    <img
      alt="Deterministic colored blocks"
      src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22216%22%20height%3D%22112%22%20viewBox%3D%220%200%20216%20112%22%3E%3Crect%20width%3D%22216%22%20height%3D%22112%22%20fill%3D%22%23fefae0%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2216%22%20width%3D%2256%22%20height%3D%2280%22%20fill%3D%22%23e76f51%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%2216%22%20width%3D%2256%22%20height%3D%2280%22%20fill%3D%22%23f4a261%22%2F%3E%3Crect%20x%3D%22144%22%20y%3D%2216%22%20width%3D%2256%22%20height%3D%2280%22%20fill%3D%22%232a9d8f%22%2F%3E%3C%2Fsvg%3E">
  </section>

  <section id="scroll-region" class="scroll-region" aria-label="Scroll area">
    <div class="scroll-content">
      <div class="scroll-marker"></div>
    </div>
  </section>

  <section class="canvas-panel">
    <p class="panel-label">CANVAS RASTER</p>
    <canvas id="fixture-canvas" width="280" height="140"></canvas>
  </section>

  <form class="form-panel">
    <label for="fixture-input">FORM CONTROL</label>
    <input id="fixture-input" value="M3 form" spellcheck="false">
    <button type="button">READY</button>
  </form>
</main>
<script>
  "use strict";

  const state = {
    protocol: 1,
    fixture: "chromium-wasm-m3-static-v1",
    ready: false,
    fontReady: false,
    imageReady: false,
    canvasReady: false,
    timerTicks: 0,
    scrollTop: 0,
    formValue: "",
  };

  window.__chromiumWasmM3Probe = () => JSON.stringify({...state});
  window.__chromiumWasmM3Fixture = state;

  setInterval(() => {
    state.timerTicks += 1;
  }, 100);

  async function initializeFixture() {
    await document.fonts.ready;
    state.fontReady = document.fonts.check("24px M3Ahem");

    const image = document.querySelector("img");
    await image.decode();
    state.imageReady = image.complete && image.naturalWidth === 216;

    const scroller = document.querySelector("#scroll-region");
    scroller.scrollTop = 48;
    state.scrollTop = scroller.scrollTop;

    const canvas = document.querySelector("#fixture-canvas");
    const context = canvas.getContext("2d", {alpha: false});
    context.fillStyle = "#264653";
    context.fillRect(0, 0, 280, 140);
    context.fillStyle = "#e9c46a";
    context.fillRect(16, 16, 112, 108);
    context.fillStyle = "#e76f51";
    context.fillRect(144, 16, 120, 48);
    context.fillStyle = "#2a9d8f";
    context.fillRect(144, 76, 120, 48);
    state.canvasReady = context.getImageData(20, 20, 1, 1).data[0] === 233;

    state.formValue = document.querySelector("#fixture-input").value;
    state.ready =
      state.fontReady &&
      state.imageReady &&
      state.canvasReady &&
      state.scrollTop === 48 &&
      state.formValue === "M3 form";
    document.documentElement.dataset.fixtureReady = String(state.ready);
  }

  initializeFixture().catch((error) => {
    state.error = String(error);
  });
</script>
