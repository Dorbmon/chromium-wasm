<!doctype html>
<meta charset="utf-8">
<title>Chromium Wasm M4 Ozone wheel fixture</title>
<style>
  @font-face {
    font-family: Ahem;
    src: url(data:font/woff2;base64,__M3_AHEM_WOFF2_BASE64__) format("woff2");
  }

  html,
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #f5f8fc;
    color: #182433;
    font-family: Ahem, sans-serif;
  }

  main {
    width: 520px;
    margin: 64px 0 0 80px;
    padding: 24px;
    border: 4px solid #163a63;
    background: #ffffff;
  }

  #wheel-outer {
    height: 250px;
    margin-top: 22px;
    overflow: auto;
    overscroll-behavior: contain;
    border: 4px solid #0f5b94;
    background: #d8f0ff;
  }

  #wheel-outer-content {
    min-height: 560px;
    padding: 16px;
  }

  #wheel-inner {
    height: 150px;
    overflow: auto;
    overscroll-behavior: contain;
    border: 4px solid #08763b;
    background: #effff3;
  }

  #wheel-inner-content {
    height: 640px;
    padding: 18px;
    background: linear-gradient(#effff3, #c8f2d5);
  }
</style>
<main>
  <p id="title">M4 OZONE WHEEL INPUT</p>
  <div id="wheel-outer">
    <div id="wheel-outer-content">
      <p>OUTER NESTED SCROLLER</p>
      <div id="wheel-inner">
        <div id="wheel-inner-content">
          INNER WHEEL TARGET<br><br>
          SCROLL DOWN WITH A TRUSTED PIXEL WHEEL EVENT<br><br>
          KEEP THE OUTER CONTAINER AT ITS INITIAL OFFSET
        </div>
      </div>
    </div>
  </div>
</main>
<script>
  (() => {
    const outer = document.querySelector("#wheel-outer");
    const inner = document.querySelector("#wheel-inner");
    const wheelEvents = {
      count: 0,
      trusted: false,
      deltaMode: null,
      deltaX: null,
      deltaY: null,
    };
    let fontReady = !document.fonts;
    Promise.resolve(document.fonts?.ready).then(() => {
      fontReady = true;
    });
    let timerTicks = 0;
    setInterval(() => { timerTicks += 1; }, 50);

    inner.addEventListener("wheel", (event) => {
      wheelEvents.count += 1;
      wheelEvents.trusted = event.isTrusted;
      wheelEvents.deltaMode = event.deltaMode;
      wheelEvents.deltaX = event.deltaX;
      wheelEvents.deltaY = event.deltaY;
    });

    window.__chromiumWasmM4Probe = () => {
      const rect = inner.getBoundingClientRect();
      return JSON.stringify({
        protocol: 1,
        timerTicks,
        fixture: "chromium-wasm-m4-ozone-wheel-v1",
        fontReady,
        wheelEvents,
        ready: document.readyState === "complete" && fontReady &&
            rect.width > 0 && inner.scrollHeight > inner.clientHeight &&
            outer.scrollHeight > outer.clientHeight,
        targetCenterX: Math.floor(rect.left + rect.width / 2),
        targetCenterY: Math.floor(rect.top + rect.height / 2),
        innerScrollLeft: inner.scrollLeft,
        innerScrollTop: inner.scrollTop,
        outerScrollLeft: outer.scrollLeft,
        outerScrollTop: outer.scrollTop,
        documentScrollTop: document.scrollingElement.scrollTop,
      });
    };
  })();
</script>
