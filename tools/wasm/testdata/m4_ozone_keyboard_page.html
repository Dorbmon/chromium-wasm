<!doctype html>
<meta charset="utf-8">
<title>Chromium Wasm M4 Ozone keyboard fixture</title>
<style>
  @font-face {
    font-family: Ahem;
    src: url(data:font/woff2;base64,__M3_AHEM_WOFF2_BASE64__) format("woff2");
  }

  html {
    min-height: 100%;
    overflow-y: scroll;
  }

  body {
    min-height: 1500px;
    margin: 0;
    background: #f5f8fc;
    color: #182433;
    font-family: Ahem, sans-serif;
  }

  main {
    width: 520px;
    margin: 72px 0 0 96px;
    padding: 28px;
    border: 4px solid #163a63;
    background: #ffffff;
  }

  #keyboard-target {
    display: inline-block;
    margin-top: 22px;
    padding: 18px 26px;
    border: 3px solid #0f5b94;
    background: #d8f0ff;
    color: #062b4d;
    outline: none;
  }

  #keyboard-target:focus {
    border-color: #ff8a00;
    box-shadow: 0 0 0 4px #ffcf75;
  }

  #result[data-key-delivered="true"] {
    color: #08763b;
  }

  #scroll-spacer {
    height: 950px;
  }
</style>
<main>
  <p id="title">M4 OZONE RAW KEY INPUT</p>
  <span id="keyboard-target" tabindex="0">CLICK, THEN PRESS ARROW DOWN</span>
  <p id="result" data-key-delivered="false">WAITING FOR ARROW DOWN</p>
</main>
<div id="scroll-spacer" aria-hidden="true"></div>
<script>
  (() => {
    const target = document.querySelector("#keyboard-target");
    const result = document.querySelector("#result");
    const root = document.scrollingElement;
    let activationCount = 0;
    let clickTrusted = false;
    let focusCount = 0;
    let focusTrusted = false;
    let targetCenter = null;
    const keyEvents = {
      keydownCount: 0,
      keyupCount: 0,
      keydownTrusted: false,
      keyupTrusted: false,
      keydownCode: null,
      keyupCode: null,
      keydownKey: null,
      keyupKey: null,
      keydownRepeat: null,
      keyupRepeat: null,
      keydownComposing: null,
      keyupComposing: null,
      keydownDefaultPrevented: null,
      keyupDefaultPrevented: null,
      keydownTargetId: null,
      keyupTargetId: null,
      trace: [],
    };
    const textInputEvents = {
      beforeinputCount: 0,
      inputCount: 0,
      compositionstartCount: 0,
      compositionupdateCount: 0,
      compositionendCount: 0,
    };
    let fontReady = !document.fonts;
    Promise.resolve(document.fonts?.ready).then(() => {
      fontReady = true;
    });
    let timerTicks = 0;
    setInterval(() => { timerTicks += 1; }, 50);

    target.addEventListener("click", (event) => {
      activationCount += 1;
      clickTrusted = event.isTrusted;
    });
    target.addEventListener("focus", (event) => {
      focusCount += 1;
      focusTrusted = event.isTrusted;
    });

    document.addEventListener("keydown", (event) => {
      if (event.code !== "ArrowDown") {
        return;
      }
      keyEvents.keydownCount += 1;
      keyEvents.keydownTrusted = event.isTrusted;
      keyEvents.keydownCode = event.code;
      keyEvents.keydownKey = event.key;
      keyEvents.keydownRepeat = event.repeat;
      keyEvents.keydownComposing = event.isComposing;
      keyEvents.keydownDefaultPrevented = event.defaultPrevented;
      keyEvents.keydownTargetId = event.target?.id || null;
      keyEvents.trace.push({
        type: "keydown",
        trusted: event.isTrusted,
        code: event.code,
        key: event.key,
        repeat: event.repeat,
        isComposing: event.isComposing,
        defaultPrevented: event.defaultPrevented,
        targetId: event.target?.id || null,
      });
      result.dataset.keyDelivered = "true";
      result.textContent = event.isTrusted ? "ARROW DOWN RECEIVED" :
        "UNTRUSTED KEY";
    });
    document.addEventListener("keyup", (event) => {
      if (event.code !== "ArrowDown") {
        return;
      }
      keyEvents.keyupCount += 1;
      keyEvents.keyupTrusted = event.isTrusted;
      keyEvents.keyupCode = event.code;
      keyEvents.keyupKey = event.key;
      keyEvents.keyupRepeat = event.repeat;
      keyEvents.keyupComposing = event.isComposing;
      keyEvents.keyupDefaultPrevented = event.defaultPrevented;
      keyEvents.keyupTargetId = event.target?.id || null;
      keyEvents.trace.push({
        type: "keyup",
        trusted: event.isTrusted,
        code: event.code,
        key: event.key,
        repeat: event.repeat,
        isComposing: event.isComposing,
        defaultPrevented: event.defaultPrevented,
        targetId: event.target?.id || null,
      });
    });
    document.addEventListener("beforeinput", () => {
      textInputEvents.beforeinputCount += 1;
    });
    document.addEventListener("input", () => {
      textInputEvents.inputCount += 1;
    });
    for (const eventType of [
      "compositionstart", "compositionupdate", "compositionend",
    ]) {
      document.addEventListener(eventType, () => {
        textInputEvents[eventType + "Count"] += 1;
      });
    }

    function captureTargetCenter() {
      if (targetCenter) {
        return targetCenter;
      }
      const rect = target.getBoundingClientRect();
      targetCenter = {
        x: Math.floor(rect.left + rect.width / 2),
        y: Math.floor(rect.top + rect.height / 2),
      };
      return targetCenter;
    }

    window.__chromiumWasmM4Probe = () => {
      const center = captureTargetCenter();
      return JSON.stringify({
        protocol: 1,
        timerTicks,
        fixture: "chromium-wasm-m4-ozone-keyboard-v2",
        fontReady,
        keyEvents,
        textInputEvents,
        ready: document.readyState === "complete" && fontReady &&
            center.x >= 0 && center.y >= 0 &&
            root.scrollHeight > root.clientHeight,
        targetCenterX: center.x,
        targetCenterY: center.y,
        activeElementId: document.activeElement?.id || null,
        activationCount,
        clickTrusted,
        focusCount,
        focusTrusted,
        scrollTop: root.scrollTop,
        resultText: result.textContent,
      });
    };
  })();
</script>
