<!doctype html>
<meta charset="utf-8">
<title>Chromium Wasm M4 Ozone pointer fixture</title>
<style>
  @font-face {
    font-family: Ahem;
    src: url(data:font/woff2;base64,__M3_AHEM_WOFF2_BASE64__) format("woff2");
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #f5f8fc;
    color: #182433;
    font-family: Ahem, sans-serif;
  }

  main {
    margin: 96px 0 0 120px;
    width: 440px;
    padding: 28px;
    border: 4px solid #163a63;
    background: #ffffff;
  }

  #m4-link {
    display: inline-block;
    margin-top: 24px;
    padding: 18px 26px;
    border: 3px solid #0f5b94;
    background: #d8f0ff;
    color: #062b4d;
    cursor: pointer;
    text-decoration: none;
  }

  #m4-link:focus {
    outline: 4px solid #ff8a00;
    outline-offset: 4px;
  }

  #m4-navigation-target {
    position: fixed;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    border: 0;
    opacity: 0;
    pointer-events: none;
  }

  #result[data-activated="true"] {
    color: #08763b;
  }
</style>
<main>
  <p id="title">M4 OZONE POINTER INPUT</p>
  <a
      id="m4-link"
      href="about:blank#m4-activated"
      target="m4-navigation-target">ACTIVATE LINK</a>
  <iframe
      id="m4-navigation-target"
      name="m4-navigation-target"
      title="M4 native-link navigation target"
      srcdoc="<!doctype html><title>M4 initial navigation target</title>"></iframe>
  <p id="result" data-activated="false">WAITING</p>
</main>
<script>
  (() => {
    const link = document.querySelector("#m4-link");
    const navigationTarget = document.querySelector("#m4-navigation-target");
    const result = document.querySelector("#result");
    let activationCount = 0;
    let clickTrusted = false;
    let clickDefaultPrevented = null;
    let navigationFrameLoadCount = 0;
    let navigationFrameLastLoadTrusted = false;
    let navigationFrameLoadCountBeforeActivation = null;
    const pointerEvents = {
      mousemove: 0,
      mousedown: 0,
      mouseup: 0,
      pointermove: 0,
      pointerdown: 0,
      pointerup: 0,
    };
    const pointerMoveTrace = [];
    let fontReady = !document.fonts;
    Promise.resolve(document.fonts?.ready).then(() => {
      fontReady = true;
    });
    let timerTicks = 0;
    setInterval(() => { timerTicks += 1; }, 50);

    navigationTarget.addEventListener("load", (event) => {
      navigationFrameLoadCount += 1;
      navigationFrameLastLoadTrusted = event.isTrusted === true;
    });

    for (const type of Object.keys(pointerEvents)) {
      document.addEventListener(type, () => {
        pointerEvents[type] += 1;
      });
    }

    link.addEventListener("pointermove", (event) => {
      pointerMoveTrace.push({
        type: event.type,
        trusted: event.isTrusted === true,
        targetId: event.target?.id || null,
        clientX: event.clientX,
        clientY: event.clientY,
      });
    });

    link.addEventListener("click", (event) => {
      activationCount += 1;
      clickTrusted = event.isTrusted === true;
      clickDefaultPrevented = event.defaultPrevented === true;
      navigationFrameLoadCountBeforeActivation = navigationFrameLoadCount;
      result.dataset.activated = "true";
      result.textContent = clickTrusted ? "ACTIVATED" : "UNTRUSTED";
    });

    window.__chromiumWasmM4Probe = () => {
      const rect = link.getBoundingClientRect();
      const displayGeometry = {
        innerWidth: window.innerWidth,
        innerHeight: window.innerHeight,
        documentClientWidth: document.documentElement.clientWidth,
        documentClientHeight: document.documentElement.clientHeight,
        screenWidth: window.screen.width,
        screenHeight: window.screen.height,
        screenAvailWidth: window.screen.availWidth,
        screenAvailHeight: window.screen.availHeight,
        devicePixelRatio: window.devicePixelRatio,
        twoDppx: window.matchMedia("(resolution: 2dppx)").matches,
      };
      return JSON.stringify({
        protocol: 1,
        timerTicks,
        fixture: "chromium-wasm-m4-ozone-pointer-v2",
        fontReady,
        pointerEvents,
        pointerMoveTrace,
        ready: document.readyState === "complete" && fontReady &&
            navigationFrameLoadCount >= 1 && rect.width > 0,
        displayGeometry,
        targetCenterX: Math.floor(rect.left + rect.width / 2),
        targetCenterY: Math.floor(rect.top + rect.height / 2),
        activationCount,
        clickTrusted,
        clickDefaultPrevented,
        navigationFrameLoadCount,
        navigationFrameLastLoadTrusted,
        navigationFrameLoadCountBeforeActivation,
        resultText: result.textContent,
      });
    };
  })();
</script>
