<!doctype html>
<meta charset="utf-8">
<title>Chromium Wasm M4 Ozone pointer fixture</title>
<style>
  @font-face {
    font-family: Ahem;
    src: url(data:font/woff2;base64,__M3_AHEM_WOFF2_BASE64__) format("woff2");
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #f5f8fc;
    color: #182433;
    font-family: Ahem, sans-serif;
  }

  main {
    margin: 96px 0 0 120px;
    width: 440px;
    padding: 28px;
    border: 4px solid #163a63;
    background: #ffffff;
  }

  #m4-link {
    display: inline-block;
    margin-top: 24px;
    padding: 18px 26px;
    border: 3px solid #0f5b94;
    background: #d8f0ff;
    color: #062b4d;
    text-decoration: none;
  }

  #m4-link:focus {
    outline: 4px solid #ff8a00;
    outline-offset: 4px;
  }

  #result[data-activated="true"] {
    color: #08763b;
  }
</style>
<main>
  <p id="title">M4 OZONE POINTER INPUT</p>
  <a id="m4-link" href="#m4-activated">ACTIVATE LINK</a>
  <p id="result" data-activated="false">WAITING</p>
</main>
<script>
  (() => {
    const link = document.querySelector("#m4-link");
    const result = document.querySelector("#result");
    let activationCount = 0;
    let clickTrusted = false;
    const pointerEvents = {
      mousemove: 0,
      mousedown: 0,
      mouseup: 0,
      pointermove: 0,
      pointerdown: 0,
      pointerup: 0,
    };
    let fontReady = !document.fonts;
    Promise.resolve(document.fonts?.ready).then(() => {
      fontReady = true;
    });
    let timerTicks = 0;
    setInterval(() => { timerTicks += 1; }, 50);

    for (const type of Object.keys(pointerEvents)) {
      document.addEventListener(type, () => {
        pointerEvents[type] += 1;
      });
    }

    link.addEventListener("click", (event) => {
      event.preventDefault();
      activationCount += 1;
      clickTrusted = event.isTrusted;
      result.dataset.activated = "true";
      result.textContent = clickTrusted ? "ACTIVATED" : "UNTRUSTED";
    });

    window.__chromiumWasmM4Probe = () => {
      const rect = link.getBoundingClientRect();
      return JSON.stringify({
        protocol: 1,
        timerTicks,
        fixture: "chromium-wasm-m4-ozone-pointer-v1",
        fontReady,
        pointerEvents,
        ready: document.readyState === "complete" && fontReady &&
            rect.width > 0,
        targetCenterX: Math.floor(rect.left + rect.width / 2),
        targetCenterY: Math.floor(rect.top + rect.height / 2),
        activationCount,
        clickTrusted,
        hash: location.hash,
        resultText: result.textContent,
      });
    };
  })();
</script>
