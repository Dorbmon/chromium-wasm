<!doctype html>
<meta charset="utf-8">
<title>Chromium Wasm M4 Ozone printable-key fixture</title>
<style>
  @font-face {
    font-family: Ahem;
    src: url(data:font/woff2;base64,__M3_AHEM_WOFF2_BASE64__) format("woff2");
  }

  body {
    min-height: 900px;
    margin: 0;
    background: #f5f8fc;
    color: #182433;
    font-family: Ahem, sans-serif;
  }

  main {
    width: 520px;
    margin: 72px 0 0 96px;
    padding: 28px;
    border: 4px solid #163a63;
    background: #ffffff;
  }

  label {
    display: block;
    margin-top: 22px;
  }

  #editable-target {
    box-sizing: border-box;
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 18px;
    border: 3px solid #0f5b94;
    background: #d8f0ff;
    color: #062b4d;
    font: inherit;
    outline: none;
  }

  #editable-target:focus {
    border-color: #ff8a00;
    box-shadow: 0 0 0 4px #ffcf75;
  }

  #result[data-text-delivered="true"] {
    color: #08763b;
  }
</style>
<main>
  <p id="title">M4 OZONE PRINTABLE KEY INPUT</p>
  <label for="editable-target">CLICK, THEN PRESS A</label>
  <input id="editable-target" type="text" autocomplete="off" spellcheck="false">
  <p id="result" data-text-delivered="false">WAITING FOR KEY A</p>
</main>
<script>
  (() => {
    const target = document.querySelector("#editable-target");
    const result = document.querySelector("#result");
    let activationCount = 0;
    let clickTrusted = false;
    let focusCount = 0;
    let focusTrusted = false;
    let targetCenter = null;
    const keyEvents = {
      keydownCount: 0,
      keyupCount: 0,
      keydownTrusted: false,
      keyupTrusted: false,
      keydownCode: null,
      keyupCode: null,
      keydownKey: null,
      keyupKey: null,
      keydownRepeat: null,
      keyupRepeat: null,
      keydownComposing: null,
      keyupComposing: null,
      keydownDefaultPrevented: null,
      keyupDefaultPrevented: null,
      keydownTargetId: null,
      keyupTargetId: null,
    };
    const textInputEvents = {
      beforeinputCount: 0,
      inputCount: 0,
      beforeinputTrusted: false,
      inputTrusted: false,
      beforeinputInputType: null,
      inputInputType: null,
      beforeinputData: null,
      inputData: null,
      beforeinputTargetId: null,
      inputTargetId: null,
      compositionstartCount: 0,
      compositionupdateCount: 0,
      compositionendCount: 0,
    };
    let fontReady = !document.fonts;
    Promise.resolve(document.fonts?.ready).then(() => {
      fontReady = true;
    });
    let timerTicks = 0;
    setInterval(() => { timerTicks += 1; }, 50);

    target.addEventListener("click", (event) => {
      activationCount += 1;
      clickTrusted = event.isTrusted;
    });
    target.addEventListener("focus", (event) => {
      focusCount += 1;
      focusTrusted = event.isTrusted;
    });

    document.addEventListener("keydown", (event) => {
      if (event.code !== "KeyA") {
        return;
      }
      keyEvents.keydownCount += 1;
      keyEvents.keydownTrusted = event.isTrusted;
      keyEvents.keydownCode = event.code;
      keyEvents.keydownKey = event.key;
      keyEvents.keydownRepeat = event.repeat;
      keyEvents.keydownComposing = event.isComposing;
      keyEvents.keydownDefaultPrevented = event.defaultPrevented;
      keyEvents.keydownTargetId = event.target?.id || null;
    });
    document.addEventListener("keyup", (event) => {
      if (event.code !== "KeyA") {
        return;
      }
      keyEvents.keyupCount += 1;
      keyEvents.keyupTrusted = event.isTrusted;
      keyEvents.keyupCode = event.code;
      keyEvents.keyupKey = event.key;
      keyEvents.keyupRepeat = event.repeat;
      keyEvents.keyupComposing = event.isComposing;
      keyEvents.keyupDefaultPrevented = event.defaultPrevented;
      keyEvents.keyupTargetId = event.target?.id || null;
    });
    target.addEventListener("beforeinput", (event) => {
      textInputEvents.beforeinputCount += 1;
      textInputEvents.beforeinputTrusted = event.isTrusted;
      textInputEvents.beforeinputInputType = event.inputType;
      textInputEvents.beforeinputData = event.data;
      textInputEvents.beforeinputTargetId = event.target?.id || null;
    });
    target.addEventListener("input", (event) => {
      textInputEvents.inputCount += 1;
      textInputEvents.inputTrusted = event.isTrusted;
      textInputEvents.inputInputType = event.inputType;
      textInputEvents.inputData = event.data;
      textInputEvents.inputTargetId = event.target?.id || null;
      result.dataset.textDelivered = "true";
      result.textContent = event.isTrusted ? "TEXT INPUT RECEIVED" :
        "UNTRUSTED TEXT INPUT";
    });
    for (const eventType of [
      "compositionstart", "compositionupdate", "compositionend",
    ]) {
      target.addEventListener(eventType, () => {
        textInputEvents[eventType + "Count"] += 1;
      });
    }

    function captureTargetCenter() {
      if (targetCenter) {
        return targetCenter;
      }
      const rect = target.getBoundingClientRect();
      targetCenter = {
        x: Math.floor(rect.left + rect.width / 2),
        y: Math.floor(rect.top + rect.height / 2),
      };
      return targetCenter;
    }

    window.__chromiumWasmM4Probe = () => {
      const center = captureTargetCenter();
      return JSON.stringify({
        protocol: 1,
        timerTicks,
        fixture: "chromium-wasm-m4-ozone-printable-key-v1",
        fontReady,
        keyEvents,
        textInputEvents,
        ready: document.readyState === "complete" && fontReady &&
            center.x >= 0 && center.y >= 0,
        targetCenterX: center.x,
        targetCenterY: center.y,
        activeElementId: document.activeElement?.id || null,
        activationCount,
        clickTrusted,
        focusCount,
        focusTrusted,
        value: target.value,
        selectionStart: target.selectionStart,
        selectionEnd: target.selectionEnd,
        resultText: result.textContent,
      });
    };
  })();
</script>
