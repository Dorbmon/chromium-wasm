<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Wasm M8 dedicated worker</title>
<style>
  @font-face {
    font-family: "M8Ahem";
    src: url("data:font/woff2;base64,__M3_AHEM_WOFF2_BASE64__")
      format("woff2");
    font-display: block;
  }

  html,
  body {
    margin: 0;
    width: 800px;
    height: 600px;
    background: #f3f7fb;
    color: #102a43;
    font-family: "M8Ahem", monospace;
  }

  main {
    margin: 32px;
    padding: 24px;
    border: 4px solid #102a43;
    background: #ffffff;
  }
</style>
<main>
  <h1>Dedicated worker</h1>
  <p id="status">Starting worker…</p>
</main>
<script>
(() => {
  "use strict";

  const protocol = 1;
  const fixture = "chromium-wasm-m8-dedicated-worker-v2";
  const expectedSequence = 37;
  const expectedPayload = "worker-message";
  const expectedBytes = [4, 8, 15, 16];
  const workerHeartbeatIntervalMs = 5;
  const workerBusyDurationMs = 75;
  const workerTerminationQuietPeriodMs = 75;
  const nestedExpectedBytes = [7, 11];
  const nestedWorkerHeartbeatIntervalMs = 5;
  const nestedWorkerBusyDurationMs = 75;
  const nestedWorkerTerminationQuietPeriodMs = 75;
  // This is deliberately a Blob-backed nested-worker baseline. Script fetch,
  // CSP, CORS, and origin-policy coverage require a separate controlled URL
  // case.
  const status = document.querySelector("#status");
  const state = {
    protocol,
    fixture,
    workerSource: "blob-data-url",
    ready: false,
    workerCreated: false,
    mainTimerTicks: 0,
    mainTransferDetached: false,
    receivedSequence: null,
    receivedPayload: null,
    receivedByteLength: null,
    receivedBytes: null,
    workerTimerTicks: null,
    workerHeartbeatCount: 0,
    workerHeartbeatsBeforeBusy: null,
    workerBusyStarted: false,
    workerBusyDurationMs: null,
    workerBusyIterations: null,
    mainTimerTicksDuringBusy: null,
    nestedWorkerCreated: false,
    nestedTransferDetached: false,
    nestedReceivedByteLength: null,
    nestedReceivedBytes: null,
    nestedWorkerTimerTicks: null,
    nestedWorkerHeartbeatCount: 0,
    nestedWorkerHeartbeatsBeforeBusy: null,
    nestedWorkerBusyStarted: false,
    nestedWorkerBusyDurationMs: null,
    nestedWorkerBusyIterations: null,
    mainTimerTicksDuringNestedBusy: null,
    nestedTerminationRequested: false,
    nestedHeartbeatsAtTermination: null,
    nestedPostTerminationHeartbeatCount: 0,
    nestedWorkerTerminated: false,
    terminationRequested: false,
    heartbeatsAtTermination: null,
    postTerminationHeartbeatCount: 0,
    workerTerminated: false,
    failure: null,
  };

  const mainTimer = setInterval(() => {
    ++state.mainTimerTicks;
  }, 5);

  const nestedWorkerSource = `
    "use strict";
    const heartbeatIntervalMs = ${nestedWorkerHeartbeatIntervalMs};
    const busyDurationMs = ${nestedWorkerBusyDurationMs};
    let heartbeatCount = 0;
    setInterval(() => {
      ++heartbeatCount;
      self.postMessage({type: "heartbeat", heartbeatCount});
    }, heartbeatIntervalMs);
    self.onmessage = ({data}) => {
      if (!data || data.type !== "start") return;
      if (!(data.buffer instanceof ArrayBuffer)) {
        self.postMessage({type: "failure", message: "nested worker has no buffer"});
        return;
      }
      const bytes = new Uint8Array(data.buffer);
      if (bytes.length !== 2 || bytes[0] !== 7 || bytes[1] !== 11) {
        self.postMessage({type: "failure", message: "nested worker transfer mismatch"});
        return;
      }
      bytes[0] += 1;
      self.postMessage({type: "busy-start", heartbeatCount});
      const startedAt = performance.now();
      let busyIterations = 0;
      while (performance.now() - startedAt < busyDurationMs) {
        ++busyIterations;
      }
      self.postMessage({
        type: "reply",
        heartbeatCount,
        workerBusyDurationMs: performance.now() - startedAt,
        busyIterations,
        buffer: bytes.buffer,
      }, [bytes.buffer]);
    };
  `;

  const workerSource = `
    "use strict";
    const heartbeatIntervalMs = ${workerHeartbeatIntervalMs};
    const busyDurationMs = ${workerBusyDurationMs};
    const nestedTerminationQuietPeriodMs = ${nestedWorkerTerminationQuietPeriodMs};
    const nestedWorkerSource = ${JSON.stringify(nestedWorkerSource)};
    let heartbeatCount = 0;
    let pendingStart = null;
    let nestedWorker = null;
    let nestedWorkerUrl = null;
    let nestedWorkerHeartbeatCount = 0;
    let nestedWorkerHeartbeatsBeforeBusy = null;
    let nestedWorkerBusyStarted = false;
    let nestedTerminationRequested = false;
    let nestedHeartbeatsAtTermination = null;
    let nestedPostTerminationHeartbeatCount = 0;
    let nestedWorkerTerminated = false;
    let nestedStartMessageSent = false;
    let nestedTransferDetached = false;
    setInterval(() => {
      ++heartbeatCount;
      self.postMessage({type: "heartbeat", heartbeatCount});
    }, heartbeatIntervalMs);

    function nestedFailure(message) {
      if (nestedWorker) {
        nestedWorker.terminate();
      }
      if (nestedWorkerUrl) {
        URL.revokeObjectURL(nestedWorkerUrl);
        nestedWorkerUrl = null;
      }
      self.postMessage({type: "nested-failure", message});
    }

    function finishOuterWork(data) {
      const bytes = new Uint8Array(data.buffer);
      bytes[0] += 1;
      self.postMessage({type: "busy-start", heartbeatCount});
      const startedAt = performance.now();
      let busyIterations = 0;
      while (performance.now() - startedAt < busyDurationMs) {
        ++busyIterations;
      }
      self.postMessage({
        type: "reply",
        protocol: data.protocol,
        sequence: data.sequence,
        payload: data.payload + ":reply",
        heartbeatCount,
        workerBusyDurationMs: performance.now() - startedAt,
        busyIterations,
        buffer: bytes.buffer,
      }, [bytes.buffer]);
    }

    function completeNestedWorker(reply) {
      if (nestedTerminationRequested) {
        nestedFailure("nested worker termination was already requested");
        return;
      }
      nestedTerminationRequested = true;
      nestedHeartbeatsAtTermination = nestedWorkerHeartbeatCount;
      nestedWorker.terminate();
      URL.revokeObjectURL(nestedWorkerUrl);
      nestedWorkerUrl = null;
      setTimeout(() => {
        if (nestedPostTerminationHeartbeatCount !== 0 ||
            nestedWorkerHeartbeatCount !== nestedHeartbeatsAtTermination) {
          nestedFailure("nested worker emitted a heartbeat after termination");
          return;
        }
        nestedWorkerTerminated = true;
        self.postMessage({
          type: "nested-complete",
          nestedTransferDetached,
          nestedReceivedByteLength: reply.receivedByteLength,
          nestedReceivedBytes: reply.receivedBytes,
          nestedWorkerTimerTicks: reply.heartbeatCount,
          nestedWorkerHeartbeatCount,
          nestedWorkerHeartbeatsBeforeBusy,
          nestedWorkerBusyDurationMs: reply.workerBusyDurationMs,
          nestedWorkerBusyIterations: reply.busyIterations,
          nestedTerminationRequested,
          nestedHeartbeatsAtTermination,
          nestedPostTerminationHeartbeatCount,
          nestedWorkerTerminated,
        });
        finishOuterWork(pendingStart);
      }, nestedTerminationQuietPeriodMs);
    }

    function startNestedWorker(data) {
      pendingStart = data;
      nestedWorkerUrl = URL.createObjectURL(
          new Blob([nestedWorkerSource], {type: "text/javascript"}));
      nestedWorker = new Worker(nestedWorkerUrl);
      self.postMessage({type: "nested-worker-created"});
      nestedWorker.onerror = (event) => {
        nestedFailure(event.message || "nested worker error");
      };
      nestedWorker.onmessageerror = () => {
        nestedFailure("nested worker message error");
      };
      nestedWorker.onmessage = ({data: nestedData}) => {
        if (!nestedData || typeof nestedData.type !== "string") {
          nestedFailure("nested worker message has no type");
          return;
        }
        if (nestedData.type === "failure") {
          nestedFailure(nestedData.message || "nested worker failure");
          return;
        }
        if (nestedData.type === "heartbeat") {
          if (!Number.isInteger(nestedData.heartbeatCount) ||
              nestedData.heartbeatCount <= nestedWorkerHeartbeatCount) {
            nestedFailure("nested worker heartbeat sequence mismatch");
            return;
          }
          if (nestedTerminationRequested) {
            ++nestedPostTerminationHeartbeatCount;
            self.postMessage({
              type: "nested-post-termination-heartbeat",
              heartbeatCount: nestedData.heartbeatCount,
            });
            return;
          }
          nestedWorkerHeartbeatCount = nestedData.heartbeatCount;
          self.postMessage({
            type: "nested-heartbeat",
            heartbeatCount: nestedWorkerHeartbeatCount,
          });
          if (nestedWorkerHeartbeatCount >= 2 && !nestedStartMessageSent) {
            nestedStartMessageSent = true;
            const transferred = new Uint8Array(${JSON.stringify(nestedExpectedBytes)}).buffer;
            nestedWorker.postMessage({type: "start", buffer: transferred},
                                     [transferred]);
            nestedTransferDetached = transferred.byteLength === 0;
            if (!nestedTransferDetached) {
              nestedFailure("outer-to-nested transfer did not detach the buffer");
            }
          }
          return;
        }
        if (nestedData.type === "busy-start") {
          if (!nestedStartMessageSent || nestedWorkerBusyStarted ||
              !Number.isInteger(nestedData.heartbeatCount) ||
              nestedData.heartbeatCount < 2) {
            nestedFailure("nested worker busy-start protocol mismatch");
            return;
          }
          nestedWorkerBusyStarted = true;
          nestedWorkerHeartbeatsBeforeBusy = nestedData.heartbeatCount;
          self.postMessage({
            type: "nested-busy-start",
            heartbeatCount: nestedData.heartbeatCount,
          });
          return;
        }
        if (nestedData.type !== "reply" || !nestedWorkerBusyStarted ||
            !Number.isInteger(nestedData.heartbeatCount) ||
            nestedData.heartbeatCount < 2 ||
            !Number.isFinite(nestedData.workerBusyDurationMs) ||
            nestedData.workerBusyDurationMs < busyDurationMs - 10 ||
            !Number.isInteger(nestedData.busyIterations) ||
            nestedData.busyIterations < 1 ||
            !(nestedData.buffer instanceof ArrayBuffer)) {
          nestedFailure("nested worker reply protocol mismatch");
          return;
        }
        const returned = new Uint8Array(nestedData.buffer);
        if (returned.byteLength !== 2 || returned[0] !== 8 ||
            returned[1] !== 11) {
          nestedFailure("nested worker transfer payload mismatch");
          return;
        }
        completeNestedWorker({
          heartbeatCount: nestedData.heartbeatCount,
          workerBusyDurationMs: nestedData.workerBusyDurationMs,
          busyIterations: nestedData.busyIterations,
          receivedByteLength: returned.byteLength,
          receivedBytes: Array.from(returned),
        });
      };
    }

    self.onmessage = ({data}) => {
      if (!data || data.type !== "start") return;
      if (pendingStart !== null) {
        nestedFailure("outer worker received a duplicate start message");
        return;
      }
      if (!(data.buffer instanceof ArrayBuffer)) {
        nestedFailure("outer worker has no transferred buffer");
        return;
      }
      startNestedWorker(data);
    };
  `;

  let worker = null;
  let workerUrl = null;
  let startMessageSent = false;
  let terminationTimer = null;

  function fail(error) {
    if (state.failure !== null) {
      return;
    }
    state.failure = String(error);
    status.textContent = "Dedicated worker failed";
    clearInterval(mainTimer);
    if (terminationTimer !== null) {
      clearTimeout(terminationTimer);
      terminationTimer = null;
    }
    if (worker) {
      worker.terminate();
    }
    if (workerUrl) {
      URL.revokeObjectURL(workerUrl);
      workerUrl = null;
    }
  }

  function beginTermination() {
    if (state.terminationRequested) {
      throw new Error("worker termination was already requested");
    }
    state.terminationRequested = true;
    state.heartbeatsAtTermination = state.workerHeartbeatCount;
    worker.terminate();
    URL.revokeObjectURL(workerUrl);
    workerUrl = null;
    terminationTimer = setTimeout(() => {
      if (state.postTerminationHeartbeatCount !== 0 ||
          state.workerHeartbeatCount !== state.heartbeatsAtTermination) {
        fail("worker emitted a heartbeat after termination");
        return;
      }
      state.workerTerminated = true;
      state.ready = true;
      status.textContent = "Dedicated worker complete";
      clearInterval(mainTimer);
      terminationTimer = null;
    }, workerTerminationQuietPeriodMs);
  }

  try {
    workerUrl = URL.createObjectURL(
        new Blob([workerSource], {type: "text/javascript"}));
    worker = new Worker(workerUrl);
    state.workerCreated = true;
    worker.onerror = (event) => {
      fail(event.message || "worker error");
    };
    worker.onmessageerror = () => {
      fail("worker message error");
    };
    worker.onmessage = ({data}) => {
      try {
        if (!data || typeof data.type !== "string") {
          throw new Error("worker message has no type");
        }
        if (data.type === "nested-failure") {
          throw new Error(data.message || "nested worker failed");
        }
        if (data.type === "nested-worker-created") {
          if (!startMessageSent || state.nestedWorkerCreated) {
            throw new Error("nested worker creation protocol mismatch");
          }
          state.nestedWorkerCreated = true;
          return;
        }
        if (data.type === "nested-heartbeat") {
          if (!state.nestedWorkerCreated ||
              !Number.isInteger(data.heartbeatCount) ||
              data.heartbeatCount <= state.nestedWorkerHeartbeatCount) {
            throw new Error("nested worker heartbeat sequence mismatch");
          }
          if (state.nestedTerminationRequested) {
            ++state.nestedPostTerminationHeartbeatCount;
            return;
          }
          state.nestedWorkerHeartbeatCount = data.heartbeatCount;
          return;
        }
        if (data.type === "nested-post-termination-heartbeat") {
          ++state.nestedPostTerminationHeartbeatCount;
          return;
        }
        if (data.type === "nested-busy-start") {
          if (!state.nestedWorkerCreated || state.nestedWorkerBusyStarted ||
              !Number.isInteger(data.heartbeatCount) ||
              data.heartbeatCount < 2) {
            throw new Error("nested worker busy-start protocol mismatch");
          }
          state.nestedWorkerBusyStarted = true;
          state.nestedWorkerHeartbeatsBeforeBusy = data.heartbeatCount;
          state.mainTimerTicksDuringNestedBusy = -state.mainTimerTicks;
          return;
        }
        if (data.type === "nested-complete") {
          if (!state.nestedWorkerCreated || !state.nestedWorkerBusyStarted ||
              data.nestedTransferDetached !== true ||
              data.nestedReceivedByteLength !== 2 ||
              !Array.isArray(data.nestedReceivedBytes) ||
              data.nestedReceivedBytes.length !== 2 ||
              data.nestedReceivedBytes[0] !== 8 ||
              data.nestedReceivedBytes[1] !== 11 ||
              !Number.isInteger(data.nestedWorkerTimerTicks) ||
              data.nestedWorkerTimerTicks < 2 ||
              !Number.isInteger(data.nestedWorkerHeartbeatCount) ||
              data.nestedWorkerHeartbeatCount <
                  state.nestedWorkerHeartbeatCount ||
              !Number.isInteger(data.nestedWorkerHeartbeatsBeforeBusy) ||
              data.nestedWorkerHeartbeatsBeforeBusy < 2 ||
              !Number.isFinite(data.nestedWorkerBusyDurationMs) ||
              data.nestedWorkerBusyDurationMs < nestedWorkerBusyDurationMs - 10 ||
              !Number.isInteger(data.nestedWorkerBusyIterations) ||
              data.nestedWorkerBusyIterations < 1 ||
              data.nestedTerminationRequested !== true ||
              !Number.isInteger(data.nestedHeartbeatsAtTermination) ||
              data.nestedHeartbeatsAtTermination < 2 ||
              data.nestedPostTerminationHeartbeatCount !== 0 ||
              state.nestedPostTerminationHeartbeatCount !== 0 ||
              data.nestedWorkerTerminated !== true ||
              state.mainTimerTicksDuringNestedBusy === null) {
            throw new Error("nested worker completion protocol mismatch");
          }
          state.nestedTransferDetached = data.nestedTransferDetached;
          state.nestedReceivedByteLength = data.nestedReceivedByteLength;
          state.nestedReceivedBytes = data.nestedReceivedBytes;
          state.nestedWorkerTimerTicks = data.nestedWorkerTimerTicks;
          state.nestedWorkerHeartbeatCount = data.nestedWorkerHeartbeatCount;
          state.nestedWorkerHeartbeatsBeforeBusy =
              data.nestedWorkerHeartbeatsBeforeBusy;
          state.nestedWorkerBusyDurationMs = data.nestedWorkerBusyDurationMs;
          state.nestedWorkerBusyIterations = data.nestedWorkerBusyIterations;
          state.nestedTerminationRequested = data.nestedTerminationRequested;
          state.nestedHeartbeatsAtTermination = data.nestedHeartbeatsAtTermination;
          state.nestedPostTerminationHeartbeatCount =
              data.nestedPostTerminationHeartbeatCount;
          state.nestedWorkerTerminated = data.nestedWorkerTerminated;
          state.mainTimerTicksDuringNestedBusy += state.mainTimerTicks;
          if (state.mainTimerTicksDuringNestedBusy < 1) {
            throw new Error(
                "main page timer did not run during nested worker CPU work");
          }
          return;
        }
        if (data.type === "heartbeat") {
          if (!Number.isInteger(data.heartbeatCount) ||
              data.heartbeatCount <= state.workerHeartbeatCount) {
            throw new Error("worker heartbeat sequence mismatch");
          }
          if (state.terminationRequested) {
            ++state.postTerminationHeartbeatCount;
            return;
          }
          state.workerHeartbeatCount = data.heartbeatCount;
          if (state.workerHeartbeatCount >= 2 && !startMessageSent) {
            startMessageSent = true;
            const transferred = new Uint8Array(expectedBytes).buffer;
            worker.postMessage({
              type: "start",
              protocol,
              sequence: expectedSequence,
              payload: expectedPayload,
              buffer: transferred,
            }, [transferred]);
            state.mainTransferDetached = transferred.byteLength === 0;
            if (!state.mainTransferDetached) {
              throw new Error(
                  "main-to-worker transfer did not detach the source buffer");
            }
          }
          return;
        }
        if (data.type === "busy-start") {
          if (!startMessageSent || state.workerBusyStarted ||
              !Number.isInteger(data.heartbeatCount) ||
              data.heartbeatCount < 2) {
            throw new Error("worker busy-start protocol mismatch");
          }
          state.workerBusyStarted = true;
          state.workerHeartbeatsBeforeBusy = data.heartbeatCount;
          state.mainTimerTicksDuringBusy = -state.mainTimerTicks;
          return;
        }
        if (data.type !== "reply" || !state.workerBusyStarted ||
            !state.nestedWorkerTerminated || !state.nestedTransferDetached ||
            state.mainTimerTicksDuringNestedBusy === null ||
            state.mainTimerTicksDuringNestedBusy < 1 ||
            data.protocol !== protocol || data.sequence !== expectedSequence ||
            data.payload !== expectedPayload + ":reply" ||
            !Number.isInteger(data.heartbeatCount) || data.heartbeatCount < 2 ||
            !Number.isFinite(data.workerBusyDurationMs) ||
            data.workerBusyDurationMs < workerBusyDurationMs - 10 ||
            !Number.isInteger(data.busyIterations) || data.busyIterations < 1 ||
            !(data.buffer instanceof ArrayBuffer)) {
          throw new Error("worker reply protocol mismatch");
        }
        const returned = new Uint8Array(data.buffer);
        if (returned.byteLength !== expectedBytes.length ||
            returned[0] !== expectedBytes[0] + 1 ||
            returned[1] !== expectedBytes[1] ||
            returned[2] !== expectedBytes[2] ||
            returned[3] !== expectedBytes[3]) {
          throw new Error("worker transfer payload mismatch");
        }
        state.receivedSequence = data.sequence;
        state.receivedPayload = data.payload;
        state.receivedByteLength = returned.byteLength;
        state.receivedBytes = Array.from(returned);
        state.workerTimerTicks = data.heartbeatCount;
        state.workerBusyDurationMs = data.workerBusyDurationMs;
        state.workerBusyIterations = data.busyIterations;
        state.mainTimerTicksDuringBusy += state.mainTimerTicks;
        if (state.mainTimerTicksDuringBusy < 1) {
          throw new Error("main page timer did not run during worker CPU work");
        }
        beginTermination();
      } catch (error) {
        fail(error);
      }
    };
  } catch (error) {
    fail(error);
  }

  window.__chromiumWasmM3Probe = () => JSON.stringify(state);
})();
</script>
