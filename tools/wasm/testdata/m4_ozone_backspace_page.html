<!doctype html>
<meta charset="utf-8">
<title>Chromium Wasm M4 Ozone Backspace fixture</title>
<style>
  @font-face {
    font-family: Ahem;
    src: url(data:font/woff2;base64,__M3_AHEM_WOFF2_BASE64__) format("woff2");
  }

  body {
    min-height: 900px;
    margin: 0;
    background: #f5f8fc;
    color: #182433;
    font-family: Ahem, sans-serif;
  }

  main {
    width: 520px;
    margin: 72px 0 0 96px;
    padding: 28px;
    border: 4px solid #163a63;
    background: #ffffff;
  }

  label {
    display: block;
    margin-top: 22px;
  }

  #editable-target {
    box-sizing: border-box;
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 18px;
    border: 3px solid #0f5b94;
    background: #d8f0ff;
    color: #062b4d;
    font: inherit;
    outline: none;
  }

  #editable-target:focus {
    border-color: #ff8a00;
    box-shadow: 0 0 0 4px #ffcf75;
  }

  #result[data-edit-delivered="true"] {
    color: #08763b;
  }
</style>
<main>
  <p id="title">M4 OZONE BACKSPACE INPUT</p>
  <label for="editable-target">CLICK, THEN PRESS A, B, AND REPEAT BACKSPACE</label>
  <input id="editable-target" type="text" autocomplete="off" spellcheck="false">
  <p id="result" data-edit-delivered="false">WAITING FOR A, B, AND REPEATED BACKSPACE</p>
</main>
<script>
  (() => {
    const target = document.querySelector("#editable-target");
    const result = document.querySelector("#result");
    let activationCount = 0;
    let clickTrusted = false;
    let focusCount = 0;
    let focusTrusted = false;
    let targetCenter = null;
    const keyEventTrace = [];
    const textInputTrace = [];
    const compositionEventCounts = {
      compositionstart: 0,
      compositionupdate: 0,
      compositionend: 0,
    };
    let fontReady = !document.fonts;
    Promise.resolve(document.fonts?.ready).then(() => {
      fontReady = true;
    });
    let timerTicks = 0;
    setInterval(() => { timerTicks += 1; }, 50);

    target.addEventListener("click", (event) => {
      activationCount += 1;
      clickTrusted = event.isTrusted;
    });
    target.addEventListener("focus", (event) => {
      focusCount += 1;
      focusTrusted = event.isTrusted;
    });

    for (const eventType of ["keydown", "keyup"]) {
      document.addEventListener(eventType, (event) => {
        if (
          event.code !== "KeyA" && event.code !== "KeyB" &&
          event.code !== "Backspace"
        ) {
          return;
        }
        keyEventTrace.push({
          type: event.type,
          trusted: event.isTrusted,
          code: event.code,
          key: event.key,
          repeat: event.repeat,
          isComposing: event.isComposing,
          defaultPrevented: event.defaultPrevented,
          targetId: event.target?.id || null,
        });
      });
    }
    target.addEventListener("beforeinput", (event) => {
      textInputTrace.push({
        type: event.type,
        trusted: event.isTrusted,
        inputType: event.inputType,
        data: typeof event.data === "string" ? event.data : null,
        isComposing: event.isComposing,
        targetId: event.target?.id || null,
      });
    });
    target.addEventListener("input", (event) => {
      textInputTrace.push({
        type: event.type,
        trusted: event.isTrusted,
        inputType: event.inputType,
        data: typeof event.data === "string" ? event.data : null,
        isComposing: event.isComposing,
        targetId: event.target?.id || null,
      });
      if (
        textInputTrace.length === 8 &&
        target.value === "" &&
        target.selectionStart === 0 &&
        target.selectionEnd === 0
      ) {
        result.dataset.editDelivered = "true";
        result.textContent = event.isTrusted
          ? "TEXT INSERTED THEN REPEATEDLY DELETED"
          : "UNTRUSTED EDIT INPUT";
      }
    });
    for (const eventType of [
      "compositionstart", "compositionupdate", "compositionend",
    ]) {
      target.addEventListener(eventType, () => {
        compositionEventCounts[eventType] += 1;
      });
    }

    function captureTargetCenter() {
      if (targetCenter) {
        return targetCenter;
      }
      const rect = target.getBoundingClientRect();
      targetCenter = {
        x: Math.floor(rect.left + rect.width / 2),
        y: Math.floor(rect.top + rect.height / 2),
      };
      return targetCenter;
    }

    window.__chromiumWasmM4Probe = () => {
      const center = captureTargetCenter();
      return JSON.stringify({
        protocol: 1,
        timerTicks,
        fixture: "chromium-wasm-m4-ozone-backspace-v2",
        fontReady,
        keyEventTrace,
        textInputTrace,
        compositionEventCounts,
        ready: document.readyState === "complete" && fontReady &&
            center.x >= 0 && center.y >= 0,
        targetCenterX: center.x,
        targetCenterY: center.y,
        activeElementId: document.activeElement?.id || null,
        activationCount,
        clickTrusted,
        focusCount,
        focusTrusted,
        value: target.value,
        selectionStart: target.selectionStart,
        selectionEnd: target.selectionEnd,
        resultText: result.textContent,
      });
    };
  })();
</script>
