<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromium Wasm M8 WebAudio ring smoke</title>
  <style>
    body {
      margin: 32px;
      color: #102a43;
      background: #f3f7fb;
      font: 16px/1.4 system-ui, sans-serif;
    }

    main {
      max-width: 48rem;
      padding: 24px;
      border: 3px solid #102a43;
      background: #fff;
    }

    button {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 192px;
      height: 48px;
      font: inherit;
    }

    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main id="m8-webaudio-root" data-state="loading-runtime">
    <h1>WebAudio ring smoke</h1>
    <p>
      This is a target-local host feasibility probe. It does not enable
      Chromium media playback.
    </p>
    <button id="m8-webaudio-start" type="button" disabled>
      Start audio ring
    </button>
    <pre id="m8-webaudio-status" aria-live="polite">Loading Wasm runtime…</pre>
  </main>
  <script type="module">
    import {runM8WebAudioRingSmokeFromQuery} from "./m8_webaudio_ring_smoke.js";

    runM8WebAudioRingSmokeFromQuery().catch(() => {
      const root = document.querySelector("#m8-webaudio-root");
      const status = document.querySelector("#m8-webaudio-status");
      if (root instanceof HTMLElement) {
        root.dataset.state = "fail";
      }
      if (status instanceof HTMLElement) {
        status.textContent = "M8 WebAudio host failure.";
      }
    });
  </script>
</body>
</html>
