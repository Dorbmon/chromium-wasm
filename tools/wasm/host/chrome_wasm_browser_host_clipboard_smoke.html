<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromium Wasm trusted DOM clipboard smoke</title>
  <style>
    :root {
      color-scheme: dark;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      background: #10141b;
      color: #dbe7f5;
    }

    body {
      margin: 0;
      padding: 16px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(640px, 1fr) 320px;
      gap: 16px;
      align-items: start;
    }

    #browser-canvas {
      display: block;
      width: 640px;
      height: 480px;
      border: 1px solid #53657d;
      background: #000;
      outline: none;
    }

    #browser-canvas:focus {
      border-color: #72ddf7;
    }

    /* This focusable, visually inert DOM control receives the real outer
       browser paste. It is never a replacement Chrome address field. */
    #browser-clipboard-proxy {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      opacity: 0;
      border: 0;
      outline: 0;
      overflow: clip;
      white-space: nowrap;
    }

    aside {
      min-width: 0;
      padding: 12px;
      border: 1px solid #53657d;
      background: #171e28;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    dl {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 4px 12px;
      margin: 0 0 12px;
    }

    dt { color: #8da9c4; }
    dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }

    #clipboard-seed {
      position: fixed;
      z-index: 2;
      left: 16px;
      bottom: 16px;
      width: min(640px, calc(100vw - 32px));
      padding: 8px;
    }

    pre {
      max-height: 420px;
      margin: 0;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    main[data-state="pass"] h1 { color: #80ed99; }
    main[data-state="fail"] h1 { color: #ff758f; }
  </style>
</head>
<body>
  <main id="browser-host-clipboard-root" data-state="running">
    <canvas
      id="browser-canvas"
      width="640"
      height="480"
      tabindex="0"
      aria-label="Chromium browser clipboard output"></canvas>
    <textarea
      id="browser-clipboard-proxy"
      aria-label="Chromium browser trusted clipboard paste proxy"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      inputmode="none"></textarea>
    <aside aria-label="Trusted DOM clipboard smoke diagnostics">
      <h1>Chromium Wasm trusted DOM clipboard smoke</h1>
      <!-- This button exists only in this controlled smoke page. Its trusted
           click seeds the outer browser clipboard; production hosts never
           call navigator.clipboard. -->
      <button id="clipboard-seed" type="button" disabled>
        Seed test clipboard for trusted paste
      </button>
      <dl id="versions"></dl>
      <pre id="browser-host-clipboard-status">Starting trusted DOM clipboard smoke…</pre>
    </aside>
  </main>
  <script type="module">
    import {runChromeWasmBrowserHostClipboardSmokeFromQuery} from "/__m7_browser_host_clipboard__/chrome_wasm_browser_host_clipboard_smoke_host.js";

    runChromeWasmBrowserHostClipboardSmokeFromQuery().catch((error) => {
      document.querySelector("#browser-host-clipboard-root").dataset.state = "fail";
      document.querySelector("#browser-host-clipboard-status").textContent =
          `HOST FAILURE: ${String(error)}`;
    });
  </script>
</body>
</html>
