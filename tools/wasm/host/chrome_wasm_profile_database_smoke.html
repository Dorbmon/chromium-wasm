<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Wasm M7 profile database graceful-close/reopen smoke</title>
<main id="m7-profile-database-root" data-state="starting">
  <h1>Chromium Wasm M7 profile database graceful-close/reopen smoke</h1>
  <dl id="m7-profile-database-versions"></dl>
  <canvas id="m7-profile-database-canvas" width="1" height="1" tabindex="0"
      aria-label="Chromium Wasm profile database smoke canvas"></canvas>
  <pre id="m7-profile-database-status">starting</pre>
</main>
<script type="module">
  import {runChromeWasmProfileDatabaseFromQuery} from
      "./chrome_wasm_profile_database_smoke.js";

  runChromeWasmProfileDatabaseFromQuery().catch((error) => {
    const root = document.querySelector("#m7-profile-database-root");
    const status = document.querySelector("#m7-profile-database-status");
    if (root instanceof HTMLElement) {
      root.dataset.state = "fail";
    }
    if (status instanceof HTMLElement) {
      status.textContent = "profile database smoke failed; details suppressed";
    }
    throw error;
  });
</script>
