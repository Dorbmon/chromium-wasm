<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Wasm Preferences ImportantFileWriter proxy-completion witness</title>
<main id="m7-profile-preferences-important-file-writer-proxy-completion-root"
    data-state="starting">
  <h1>Chromium Wasm Preferences ImportantFileWriter proxy-completion witness</h1>
  <dl id="m7-profile-preferences-important-file-writer-proxy-completion-versions"></dl>
  <canvas id="m7-profile-preferences-important-file-writer-proxy-completion-canvas"
      width="1" height="1" tabindex="0"
      aria-label="Chromium Wasm Preferences ImportantFileWriter proxy-completion witness canvas"></canvas>
  <pre id="m7-profile-preferences-important-file-writer-proxy-completion-status">starting</pre>
</main>
<script type="module">
  import {runChromeWasmProfilePreferencesImportantFileWriterProxyCompletionFromQuery} from
      "./chrome_wasm_profile_preferences_important_file_writer_proxy_completion_smoke.js";

  runChromeWasmProfilePreferencesImportantFileWriterProxyCompletionFromQuery().catch(
      (_error) => {
        const root = document.querySelector(
            "#m7-profile-preferences-important-file-writer-proxy-completion-root");
        const status = document.querySelector(
            "#m7-profile-preferences-important-file-writer-proxy-completion-status");
        if (root instanceof HTMLElement) root.dataset.state = "fail";
        if (status instanceof HTMLElement) {
          status.textContent = "proxy-completion witness failed; details suppressed";
        }
      });
</script>
