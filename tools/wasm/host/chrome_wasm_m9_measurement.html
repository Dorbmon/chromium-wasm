<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromium Wasm pre-release M9 measurement baseline</title>
  <style>
    :root {
      color-scheme: dark;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      background: #10141b;
      color: #dbe7f5;
    }

    body {
      margin: 0;
      padding: 16px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(800px, 1fr) 320px;
      gap: 16px;
      align-items: start;
    }

    #browser-canvas {
      display: block;
      width: 800px;
      height: 600px;
      border: 1px solid #53657d;
      background: #000;
      outline: none;
    }

    aside {
      min-width: 0;
      padding: 12px;
      border: 1px solid #53657d;
      background: #171e28;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    pre {
      max-height: 560px;
      margin: 0;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    main[data-state="failed"] h1 {
      color: #ff758f;
    }

    main[data-state="ready"],
    main[data-state="complete"] h1 {
      color: #80ed99;
    }
  </style>
</head>
<body>
  <main id="measurement-root" data-state="starting">
    <canvas
      id="browser-canvas"
      width="800"
      height="600"
      tabindex="0"
      aria-label="Chromium Chrome output"></canvas>
    <aside aria-label="Pre-release M9 measurement diagnostics">
      <h1>Chromium Wasm pre-release M9 baseline</h1>
      <pre id="measurement-status">Starting one fresh host run…</pre>
    </aside>
  </main>
  <script type="module">
    import {runChromeWasmM9MeasurementFromQuery} from
        "./chrome_wasm_m9_measurement_host.js";

    runChromeWasmM9MeasurementFromQuery().catch((error) => {
      document.querySelector("#measurement-root").dataset.state = "failed";
      document.querySelector("#measurement-status").textContent =
          `HOST FAILURE: ${String(error)}`;
    });
  </script>
</body>
</html>
