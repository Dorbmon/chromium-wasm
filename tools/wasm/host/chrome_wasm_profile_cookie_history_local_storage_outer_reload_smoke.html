<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Wasm M7 profile Cookie/History/LocalStorage outer-reload smoke</title>
<main id="m7-profile-cookie-history-local-storage-outer-reload-root" data-state="starting">
  <h1>Chromium Wasm M7 profile Cookie/History/LocalStorage outer-reload smoke</h1>
  <dl id="m7-profile-cookie-history-local-storage-outer-reload-versions"></dl>
  <canvas id="m7-profile-cookie-history-local-storage-outer-reload-canvas"
      width="1" height="1" tabindex="0"
      aria-label="Chromium Wasm profile Cookie/History/LocalStorage smoke canvas"></canvas>
  <pre id="m7-profile-cookie-history-local-storage-outer-reload-status">starting</pre>
</main>
<script type="module">
  import {runChromeWasmProfileCookieHistoryLocalStorageOuterReloadFromQuery} from
      "./chrome_wasm_profile_cookie_history_local_storage_outer_reload_smoke.js";

  runChromeWasmProfileCookieHistoryLocalStorageOuterReloadFromQuery().catch((error) => {
    const root = document.querySelector(
        "#m7-profile-cookie-history-local-storage-outer-reload-root");
    const status = document.querySelector(
        "#m7-profile-cookie-history-local-storage-outer-reload-status");
    if (root instanceof HTMLElement) {
      root.dataset.state = "fail";
    }
    if (status instanceof HTMLElement) {
      status.textContent =
          "profile Cookie/History/LocalStorage outer-reload smoke failed; " +
          "details suppressed";
    }
    throw error;
  });
</script>
