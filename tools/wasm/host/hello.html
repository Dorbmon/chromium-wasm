<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromium Wasm smoke</title>
  <style>
    :root {
      color-scheme: dark;
      font: 14px/1.4 system-ui, sans-serif;
    }
    body {
      margin: 2rem;
      background: #15171a;
      color: #f3f4f6;
    }
    canvas {
      display: block;
      width: 640px;
      height: 360px;
      border: 1px solid #596270;
      background: #20242a;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main id="smoke-root" data-state="running">
    <h1 id="smoke-heading">Chromium Wasm smoke</h1>
    <canvas id="browser-canvas" tabindex="0" width="640" height="360"></canvas>
    <pre id="smoke-status">RUNNING</pre>
    <dl id="versions"></dl>
  </main>
  <script type="module">
    const parameters = new URLSearchParams(location.search);
    const smokeCases = Object.freeze({
      hello: Object.freeze({
        modulePath: "/out/wasm/hello_wasm.js",
        sentinelPrefix: "CHROMIUM_WASM_M0",
        requiredStdout: Object.freeze([
          "CHROMIUM_WASM_M0:RUNTIME_START",
          "CHROMIUM_WASM_M0:RUNTIME_END",
          "CHROMIUM_WASM_M0:STDOUT",
          "CHROMIUM_WASM_M0:PASS",
        ]),
        requiredStderr: Object.freeze([
          "CHROMIUM_WASM_M0:STDERR capture=ok",
        ]),
        requireSeparateStreams: true,
      }),
      base: Object.freeze({
        modulePath: "/out/wasm/m1_base_smoke.js",
        sentinelPrefix: "CHROMIUM_WASM_M1_BASE",
        requiredStdout: Object.freeze([
          "CHROMIUM_WASM_M1_BASE:RUNTIME_START",
          "CHROMIUM_WASM_M1_BASE:RUNTIME_END",
          "CHROMIUM_WASM_M1_BASE:RESULT",
          "CHROMIUM_WASM_M1_BASE:PASS",
        ]),
        requiredStderr: Object.freeze([]),
        requireSeparateStreams: false,
      }),
      tasks: Object.freeze({
        modulePath: "/out/wasm/m1_task_smoke.js",
        sentinelPrefix: "CHROMIUM_WASM_M1_TASK",
        requiredStdout: Object.freeze([
          "CHROMIUM_WASM_M1_TASK:RUNTIME_START",
          "CHROMIUM_WASM_M1_TASK:RUNTIME_END",
          "CHROMIUM_WASM_M1_TASK:RESULT",
          "immediate=ok",
          "delayed_not_early=ok",
          "delayed_deadline_order=ok",
          "worker_to_app_wake=ok",
          "app_to_worker=ok",
          "nested_quit_independent=ok",
          "outer_continues=ok",
          "sleeping_quit_wake=ok",
          "idle_wait_bounded=ok",
          "clean_shutdown=ok",
          "task_count=18",
          "delayed_wake_count=3",
          "max_nesting=2",
          "joinable_created=1",
          "joinable_joined=1",
          "wake_count_bounded_nonzero=ok",
          "wait_count_bounded_nonzero=ok",
          "browser_heartbeat=external",
          "CHROMIUM_WASM_M1_TASK:PASS",
        ]),
        requiredStderr: Object.freeze([]),
        requireSeparateStreams: false,
      }),
      rust: Object.freeze({
        modulePath: "/out/wasm/m1_rust_smoke.js",
        sentinelPrefix: "CHROMIUM_WASM_M1_RUST",
        requiredStdout: Object.freeze([
          "CHROMIUM_WASM_M1_RUST:RUNTIME_START",
          "CHROMIUM_WASM_M1_RUST:RUNTIME_END",
          "CHROMIUM_WASM_M1_RUST:RESULT",
          "cpp_to_rust=ok",
          "rust_to_cpp=ok",
          "cxx_bridge=ok",
          "structured_abi=ok",
          "integer_widths=ok",
          "pointer_width=32",
          "vec=ok",
          "string=ok",
          "allocation=ok",
          "free=ok",
          "atomics=ok",
          "arc=ok",
          "mutex=ok",
          "thread_spawn=ok",
          "thread_join=ok",
          "callback_count=1",
          "drop_count=1",
          "same_module=ok",
          "clean_shutdown=ok",
          "browser_heartbeat=external",
          "CHROMIUM_WASM_M1_RUST:PASS",
        ]),
        requiredStderr: Object.freeze([]),
        requireSeparateStreams: false,
      }),
      v8_base: Object.freeze({
        modulePath: "/out/wasm/wasm_v8_base_smoke.js",
        sentinelPrefix: "CHROMIUM_WASM_M2_V8_BASE",
        minimumRuntimeMs: 200,
        requiredStdout: Object.freeze([
          "CHROMIUM_WASM_M2_V8_BASE:RUNTIME_START",
          "CHROMIUM_WASM_M2_V8_BASE:RUNTIME_END",
          "CHROMIUM_WASM_M2_V8_BASE:RESULT",
          "host=wasm32",
          "target=arm",
          "simulator_config=arm",
          "jitless_config=on",
          "threads=ok",
          "tls=ok",
          "time=ok",
          "entropy=ok",
          "stack_bounds=ok",
          "stack_trace=unsupported_reported",
          "page_allocator=logical_ok",
          "file_mapping=buffered_ok",
          "CHROMIUM_WASM_M2_V8_BASE:PASS",
        ]),
        requiredStderr: Object.freeze([]),
        requireSeparateStreams: false,
      }),
      v8_snapshotless: Object.freeze({
        modulePath: "/out/wasm/wasm_v8_snapshotless_smoke.js",
        sentinelPrefix: "CHROMIUM_WASM_M2_V8_JS",
        minimumRuntimeMs: 1000,
        requiredStdout: Object.freeze([
          "CHROMIUM_WASM_M2_V8_JS:RUNTIME_START",
          "CHROMIUM_WASM_M2_V8_JS:RUNTIME_END",
          "CHROMIUM_WASM_M2_V8_JS:RESULT",
          "value=100:42:42:0:1234567890123456800",
          "arrays=ok",
          "closures=ok",
          "regexp=interpreter",
          "json=ok",
          "bigint=ok",
          "lookup_pair=ok",
          "fp_calls=ok",
          "classes=ok",
          "exceptions=js_and_native",
          "stacks=js_and_native_frames",
          "promises=explicit_checkpoint",
          "async=ok",
          "proxy=ok",
          "typed_arrays=ok",
          "native_callback=ok",
          "gc_stress=ok",
          "gc_reclamation=verified_after_isolate_disposal",
          "modules=graph_tla",
          "timers=delayed_foreground",
          "startup_snapshot=runtime_generated",
          "external_startup_data=off",
          "snapshot_anchor=retained_during_cycles",
          "isolate=ordinary",
          "lifecycle_cycles=3",
          "metrics_scope=ordinary_isolates",
          "heap_sampling=feature_gc_and_cycle",
          "i18n=off",
          "host=wasm32",
          "target=arm",
          "simulator=arm",
          "jitless=on",
          "version=15.0.245.21",
          "CHROMIUM_WASM_M2_V8_JS:PASS",
        ]),
        requiredStderr: Object.freeze([]),
        requireSeparateStreams: false,
      }),
      shared_memory: Object.freeze({
        modulePath: "/out/wasm/m1_shared_memory_smoke.js",
        sentinelPrefix: "CHROMIUM_WASM_M1_SHARED_MEMORY",
        minimumRuntimeMs: 250,
        requiredStdout: Object.freeze([
          "CHROMIUM_WASM_M1_SHARED_MEMORY:RUNTIME_START",
          "CHROMIUM_WASM_M1_SHARED_MEMORY:RUNTIME_END",
          "CHROMIUM_WASM_M1_SHARED_MEMORY:RESULT",
          "CHROMIUM_WASM_M1_SHARED_MEMORY:METRICS",
          "capability_handle=ok",
          "writable_create=ok",
          "writable_map=ok",
          "byte_round_trip=ok",
          "handle_move=ok",
          "serialization_round_trip=ok",
          "mapping_outlives_handle=ok",
          "writable_to_read_only=ok",
          "read_only_create=ok",
          "read_only_duplicate=ok",
          "read_only_write_rejected=ok",
          "mode_mismatch_rejected=ok",
          "writable_duplicate_rejected=ok",
          "invalid_capability_rejected=ok",
          "stale_capability_rejected=ok",
          "corrupt_metadata_rejected=ok",
          "corrupt_rights_rejected=ok",
          "unsafe_create=ok",
          "unsafe_duplicate=ok",
          "partial_map=ok",
          "invalid_range_rejected=ok",
          "zero_size_rejected=ok",
          "minimum_alignment=32",
          "vm_alignment=65536",
          "guid_identity=ok",
          "region_lifetime=ok",
          "concurrent_threads=ok",
          "concurrent_overlap=ok",
          "worker_threads_created=1",
          "worker_threads_joined=1",
          "worker_creation_failures=0",
          "max_concurrent_test_threads=2",
          "clean_shutdown=ok",
          "memory_metrics=ok",
          "initial_heap_bytes=",
          "peak_heap_bytes=",
          "max_heap_bytes=2147483648",
          "browser_heartbeat=external",
          "CHROMIUM_WASM_M1_SHARED_MEMORY:PASS",
        ]),
        requiredStderr: Object.freeze([]),
        requireSeparateStreams: false,
      }),
      mojo: Object.freeze({
        modulePath: "/out/wasm/m1_mojo_smoke.js",
        sentinelPrefix: "CHROMIUM_WASM_M1_MOJO",
        minimumRuntimeMs: 250,
        requiredStdout: Object.freeze([
          "CHROMIUM_WASM_M1_MOJO:RUNTIME_START",
          "CHROMIUM_WASM_M1_MOJO:RUNTIME_END",
          "CHROMIUM_WASM_M1_MOJO:RESULT",
          "CHROMIUM_WASM_M1_MOJO:METRICS",
          "single_node=ok",
          "message_pipe_create=ok",
          "empty_pipe_should_wait=ok",
          "shared_buffer_create=ok",
          "sender_map=ok",
          "deterministic_write=ok",
          "shared_buffer_attach=ok",
          "message_write=ok",
          "message_read=ok",
          "shared_buffer_extract=ok",
          "receiver_map=ok",
          "payload_verified=ok",
          "unsafe_duplicate=ok",
          "duplicate_map=ok",
          "receiver_modify=ok",
          "sender_observed_modify=ok",
          "duplicate_unmap_accounting=ok",
          "invalid_region_rejected=ok",
          "use_after_final_close_rejected=ok",
          "oversized_create_rejected=ok",
          "oversized_map_rejected=ok",
          "readonly_after_unsafe_rejected=ok",
          "readonly_mode_mismatch_rejected=ok",
          "corrupt_metadata_rejected=ok",
          "remote_transport_rejected=ok",
          "driver_failures_rejected=ok",
          "mapping_outlives_handles=ok",
          "all_handles_closed=ok",
          "clean_shutdown=ok",
          "memory_metrics=ok",
          "initial_heap_bytes=",
          "peak_heap_bytes=",
          "max_heap_bytes=2147483648",
          "browser_heartbeat=external",
          "CHROMIUM_WASM_M1_MOJO:PASS",
        ]),
        requiredStderr: Object.freeze([]),
        requireSeparateStreams: false,
      }),
    });
    const requestedCase = parameters.get("case") || "hello";
    const caseConfiguration = smokeCases[requestedCase];
    const resultToken = parameters.get("token");
    const requestedModulePath = parameters.get("module");
    const requestedTimeout = Number(parameters.get("timeout_ms"));
    const runtimeTimeoutMs = Number.isFinite(requestedTimeout)
      ? Math.max(1000, Math.min(120000, requestedTimeout))
      : 20000;
    const resultEndpoint = `/__smoke__/result/${encodeURIComponent(resultToken)}`;
    const root = document.querySelector("#smoke-root");
    const heading = document.querySelector("#smoke-heading");
    const canvas = document.querySelector("#browser-canvas");
    const status = document.querySelector("#smoke-status");
    const versions = document.querySelector("#versions");
    const stdout = [];
    const stderr = [];
    let timerTicks = 0;
    let animationFrameTicks = 0;
    let finished = false;
    let runtimeStartTimerTicks = null;
    let runtimeEndTimerTicks = null;
    let runtimeStartAnimationFrameTicks = null;
    let runtimeEndAnimationFrameTicks = null;
    let runtimeStartTime = null;
    let runtimeEndTime = null;
    let runtimeInitialized = false;
    let runtimeTimeout = null;
    let exitCode = null;
    let canvasFocused = false;
    let resolveExit;
    let rejectExit;

    const diagnostic = {
      protocol: 1,
      case: requestedCase,
      state: "running",
      stdout,
      stderr,
      heartbeat: {},
    };
    window.__chromiumWasmSmoke = diagnostic;
    heading.textContent = `Chromium Wasm ${requestedCase} smoke`;

    for (const [name, value] of [
      ["Chromium", parameters.get("chromium")],
      ["V8", parameters.get("v8")],
      ["Emscripten", parameters.get("emscripten")],
      ["Port", parameters.get("port")],
    ]) {
      const term = document.createElement("dt");
      const description = document.createElement("dd");
      term.textContent = name;
      description.textContent = value || "unknown";
      versions.append(term, description);
    }

    const timerHeartbeat = setInterval(() => {
      timerTicks += 1;
    }, 10);
    let animationFrameRequest = null;
    function animationFrameHeartbeat() {
      animationFrameTicks += 1;
      animationFrameRequest = requestAnimationFrame(animationFrameHeartbeat);
    }
    animationFrameRequest = requestAnimationFrame(animationFrameHeartbeat);
    const exitPromise = new Promise((resolve, reject) => {
      resolveExit = resolve;
      rejectExit = reject;
    });

    async function postResult(result) {
      try {
        const response = await fetch(resultEndpoint, {
          method: "POST",
          cache: "no-store",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(result),
        });
        if (!response.ok) {
          throw new Error(
            `result endpoint returned HTTP ${response.status}`);
        }
      } catch (error) {
        status.textContent += `\nRESULT POST FAILED: ${String(error)}`;
      }
    }

    async function finish(result) {
      if (finished) {
        return;
      }
      finished = true;
      clearInterval(timerHeartbeat);
      cancelAnimationFrame(animationFrameRequest);
      clearTimeout(runtimeTimeout);
      diagnostic.state = result.status;
      diagnostic.heartbeat = result.heartbeat;
      root.dataset.state = result.status;
      status.textContent = JSON.stringify(result, null, 2);
      await postResult(result);
    }

    function recordOutput(target, line) {
      const text = String(line);
      target.push(text);
      if (text.includes(
          `${caseConfiguration.sentinelPrefix}:RUNTIME_START`)) {
        runtimeStartTimerTicks = timerTicks;
        runtimeStartAnimationFrameTicks = animationFrameTicks;
        runtimeStartTime = performance.now();
      }
      if (text.includes(
          `${caseConfiguration.sentinelPrefix}:RUNTIME_END`)) {
        runtimeEndTimerTicks = timerTicks;
        runtimeEndAnimationFrameTicks = animationFrameTicks;
        runtimeEndTime = performance.now();
      }
    }

    function failureResult(error) {
      return {
        protocol: 1,
        case: requestedCase,
        status: "fail",
        exitCode,
        crossOriginIsolated,
        sharedArrayBuffer: typeof SharedArrayBuffer === "function",
        canvasFocused,
        stdout,
        stderr,
        heartbeat: {
          timerStartTicks: runtimeStartTimerTicks,
          timerEndTicks: runtimeEndTimerTicks,
          timerDelta:
            runtimeStartTimerTicks === null || runtimeEndTimerTicks === null
              ? null : runtimeEndTimerTicks - runtimeStartTimerTicks,
          animationFrameStartTicks: runtimeStartAnimationFrameTicks,
          animationFrameEndTicks: runtimeEndAnimationFrameTicks,
          animationFrameDelta:
            runtimeStartAnimationFrameTicks === null ||
                runtimeEndAnimationFrameTicks === null
              ? null
              : runtimeEndAnimationFrameTicks -
                  runtimeStartAnimationFrameTicks,
          elapsedMs: runtimeStartTime === null || runtimeEndTime === null
            ? null : runtimeEndTime - runtimeStartTime,
        },
        failedChecks: [],
        error: String(error),
      };
    }

    addEventListener("error", (event) => {
      void finish(failureResult(event.error || event.message));
    });
    addEventListener("unhandledrejection", (event) => {
      void finish(failureResult(event.reason));
    });

    try {
      if (!resultToken) {
        throw new Error("missing result token");
      }
      if (!caseConfiguration) {
        throw new Error(`unsupported smoke case: ${requestedCase}`);
      }
      if (requestedModulePath &&
          requestedModulePath !== caseConfiguration.modulePath) {
        throw new Error(
          `module does not match ${requestedCase} smoke case`);
      }
      canvas.focus();
      canvasFocused = document.activeElement === canvas;
      const {default: createModule} =
        await import(caseConfiguration.modulePath);
      runtimeTimeout = setTimeout(() => {
        rejectExit(new Error("runtime timeout"));
      }, runtimeTimeoutMs);

      await createModule({
        canvas,
        print(line) {
          recordOutput(stdout, line);
        },
        printErr(line) {
          recordOutput(stderr, line);
        },
        onRuntimeInitialized() {
          runtimeInitialized = true;
        },
        onExit(code) {
          exitCode = Number(code);
          resolveExit(exitCode);
        },
        onAbort(reason) {
          rejectExit(new Error(`abort: ${String(reason)}`));
        },
      });
      await exitPromise;

      const timerDelta = runtimeEndTimerTicks - runtimeStartTimerTicks;
      const animationFrameDelta =
        runtimeEndAnimationFrameTicks - runtimeStartAnimationFrameTicks;
      const runtimeElapsed = runtimeEndTime - runtimeStartTime;
      const combinedOutput = [...stdout, ...stderr].join("\n");
      const runtimeStartSentinel =
        `${caseConfiguration.sentinelPrefix}:RUNTIME_START`;
      const runtimeEndSentinel =
        `${caseConfiguration.sentinelPrefix}:RUNTIME_END`;
      const passSentinel = `${caseConfiguration.sentinelPrefix}:PASS`;
      const failureSentinel = `${caseConfiguration.sentinelPrefix}:FAIL`;
      const runtimeStartIndex = stdout.findIndex(
        (line) => line.includes(runtimeStartSentinel));
      const runtimeEndIndex = stdout.findIndex(
        (line) => line.includes(runtimeEndSentinel));
      const passIndex = stdout.findIndex(
        (line) => line.includes(passSentinel));
      const checks = {
        canvasFocused,
        crossOriginIsolated,
        exitCode: exitCode === 0,
        animationFrames:
          Number.isFinite(animationFrameDelta) && animationFrameDelta >= 3,
        heartbeat: Number.isFinite(timerDelta) && timerDelta >= 3,
        noFailure: !combinedOutput.includes(failureSentinel),
        pass: stdout.some((line) => line.includes(passSentinel)),
        runtimeInitialized,
        runtimeInterval:
          Number.isFinite(runtimeElapsed) &&
          runtimeElapsed >= (caseConfiguration.minimumRuntimeMs ?? 200),
        runtimeMarkers:
          runtimeStartTimerTicks !== null &&
          runtimeEndTimerTicks !== null &&
          runtimeStartAnimationFrameTicks !== null &&
          runtimeEndAnimationFrameTicks !== null,
        runtimeOrder:
          runtimeStartIndex >= 0 &&
          runtimeStartIndex < runtimeEndIndex &&
          runtimeEndIndex < passIndex,
        sharedArrayBuffer: typeof SharedArrayBuffer === "function",
        stderr: caseConfiguration.requiredStderr.every(
          (sentinel) => stderr.some((line) => line.includes(sentinel))),
        streamsSeparate:
          !caseConfiguration.requireSeparateStreams ||
          (
            !caseConfiguration.requiredStderr.some(
              (sentinel) => stdout.some(
                (line) => line.includes(sentinel))) &&
            !stderr.some(
              (line) => line.includes(
                `${caseConfiguration.sentinelPrefix}:STDOUT`))
          ),
        stdout: caseConfiguration.requiredStdout.every(
          (sentinel) => stdout.some((line) => line.includes(sentinel))),
      };
      const failedChecks = Object.entries(checks)
        .filter(([, passed]) => !passed)
        .map(([name]) => name);
      const result = {
        protocol: 1,
        case: requestedCase,
        status: failedChecks.length === 0 ? "pass" : "fail",
        exitCode,
        crossOriginIsolated,
        sharedArrayBuffer: typeof SharedArrayBuffer === "function",
        canvasFocused,
        stdout,
        stderr,
        heartbeat: {
          timerStartTicks: runtimeStartTimerTicks,
          timerEndTicks: runtimeEndTimerTicks,
          timerDelta,
          animationFrameStartTicks: runtimeStartAnimationFrameTicks,
          animationFrameEndTicks: runtimeEndAnimationFrameTicks,
          animationFrameDelta,
          elapsedMs: runtimeElapsed,
        },
        failedChecks,
        error: failedChecks.length === 0
          ? null : `failed checks: ${failedChecks.join(", ")}`,
      };
      await finish(result);
    } catch (error) {
      await finish(failureResult(error));
    }
  </script>
</body>
</html>
