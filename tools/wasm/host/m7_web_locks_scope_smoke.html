<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Wasm M7 Web Locks scope smoke</title>
<main id="m7-web-locks-scope-root" data-state="starting">
  <h1>Chromium Wasm M7 Web Locks scope smoke</h1>
  <pre id="m7-web-locks-scope-status">starting</pre>
</main>
<script type="module">
  import {runM7WebLocksScopeSmokeFromQuery} from
      "./m7_web_locks_scope_smoke.js";

  runM7WebLocksScopeSmokeFromQuery().catch((error) => {
    const root = document.querySelector("#m7-web-locks-scope-root");
    const status = document.querySelector("#m7-web-locks-scope-status");
    if (root instanceof HTMLElement) {
      root.dataset.state = "fail";
    }
    if (status instanceof HTMLElement) {
      status.textContent = String(error);
    }
    // The browser runner receives the token-authenticated result. Avoid a
    // second unhandled-rejection diagnostic that would obscure that result.
    console.error(error);
  });
</script>
