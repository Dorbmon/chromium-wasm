<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromium Wasm trusted DOM text smoke</title>
  <style>
    :root {
      color-scheme: dark;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      background: #10141b;
      color: #dbe7f5;
    }

    body {
      margin: 0;
      padding: 16px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(640px, 1fr) 320px;
      gap: 16px;
      align-items: start;
    }

    #browser-canvas {
      display: block;
      width: 640px;
      height: 480px;
      border: 1px solid #53657d;
      background: #000;
      outline: none;
    }

    #browser-canvas:focus {
      border-color: #72ddf7;
    }

    /* This remains focusable and receives only the one trusted beforeinput
       transaction. It is visually inert, but never hidden/disabled/readonly
       because browser DOM input requires a genuine focused editing element. */
    #browser-text-proxy {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      opacity: 0;
      border: 0;
      outline: 0;
      overflow: clip;
      white-space: nowrap;
    }

    aside {
      min-width: 0;
      padding: 12px;
      border: 1px solid #53657d;
      background: #171e28;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    dl {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 4px 12px;
      margin: 0 0 12px;
    }

    dt { color: #8da9c4; }
    dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }

    pre {
      max-height: 420px;
      margin: 0;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    main[data-state="pass"] h1 { color: #80ed99; }
    main[data-state="fail"] h1 { color: #ff758f; }
  </style>
</head>
<body>
  <main id="browser-host-text-root" data-state="running">
    <canvas
      id="browser-canvas"
      width="640"
      height="480"
      tabindex="0"
      aria-label="Chromium browser text output"></canvas>
    <textarea
      id="browser-text-proxy"
      aria-label="Chromium browser trusted text input proxy"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      inputmode="none"></textarea>
    <aside aria-label="Trusted DOM text smoke diagnostics">
      <h1>Chromium Wasm trusted DOM text smoke</h1>
      <dl id="versions"></dl>
      <pre id="browser-host-text-status">Starting trusted DOM text smoke…</pre>
    </aside>
  </main>
  <script type="module">
    import {runChromeWasmBrowserHostTextSmokeFromQuery} from "/__m6_browser_host_text__/chrome_wasm_browser_host_text_smoke_host.js";

    runChromeWasmBrowserHostTextSmokeFromQuery().catch((error) => {
      document.querySelector("#browser-host-text-root").dataset.state = "fail";
      document.querySelector("#browser-host-text-status").textContent =
          `HOST FAILURE: ${String(error)}`;
    });
  </script>
</body>
</html>
