<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromium Wasm accessibility snapshot smoke</title>
  <style>
    :root { color-scheme: dark; font: 13px/1.5 ui-monospace, monospace; background: #10141b; color: #dbe7f5; }
    body { margin: 0; padding: 16px; }
    main { display: grid; grid-template-columns: minmax(640px, 1fr) 320px; gap: 16px; align-items: start; }
    #browser-canvas { display: block; width: 640px; height: 480px; border: 1px solid #53657d; background: #000; outline: none; }
    #browser-canvas:focus { border-color: #72ddf7; }
    aside { min-width: 0; padding: 12px; border: 1px solid #53657d; background: #171e28; }
    h1 { margin: 0 0 12px; font-size: 16px; }
    dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0 0 12px; }
    dt { color: #8da9c4; } dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
    pre { max-height: 420px; margin: 0; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
    main[data-state="pass"] h1 { color: #80ed99; }
    main[data-state="fail"] h1 { color: #ff758f; }

    /* This stays outside the canvas and remains exposed to host assistive
       technology while taking no visual or pointer-input ownership. It is a
       fixed test-only semantic mirror, not a general accessibility overlay. */
    #accessibility-mirror {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main id="browser-accessibility-snapshot-root" data-state="running">
    <section aria-label="Chromium browser canvas and passive accessibility mirror">
      <canvas id="browser-canvas" width="640" height="480" tabindex="0"
          aria-label="Chromium browser accessibility snapshot output"></canvas>
      <div id="accessibility-mirror"></div>
    </section>
    <aside aria-label="Accessibility snapshot smoke diagnostics">
      <h1>Chromium Wasm accessibility snapshot smoke</h1>
      <dl id="versions"></dl>
      <pre id="browser-accessibility-snapshot-status">Starting fixed Chromium AX snapshot smoke…</pre>
    </aside>
  </main>
  <script type="module">
    import {runChromeWasmBrowserAccessibilitySnapshotSmokeFromQuery} from "/__m8_browser_accessibility_snapshot__/chrome_wasm_browser_accessibility_snapshot_smoke_host.js";

    runChromeWasmBrowserAccessibilitySnapshotSmokeFromQuery().catch((error) => {
      document.querySelector("#browser-accessibility-snapshot-root").dataset.state = "fail";
      document.querySelector("#browser-accessibility-snapshot-status").textContent =
          `HOST FAILURE: ${String(error)}`;
    });
  </script>
</body>
</html>
