<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Wasm M7 profile database write-interruption diagnostic</title>
<main id="m7-profile-database-write-interruption-root" data-state="starting">
  <h1>Chromium Wasm M7 profile database write-interruption diagnostic</h1>
  <dl id="m7-profile-database-write-interruption-versions"></dl>
  <canvas id="m7-profile-database-write-interruption-canvas" width="1" height="1"
      tabindex="0"
      aria-label="Chromium Wasm profile database write-interruption diagnostic canvas"></canvas>
  <pre id="m7-profile-database-write-interruption-status">starting</pre>
</main>
<script type="module">
  import {runChromeWasmProfileDatabaseWriteInterruptionFromQuery} from
      "./chrome_wasm_profile_database_write_interruption_smoke.js";

  runChromeWasmProfileDatabaseWriteInterruptionFromQuery().catch((error) => {
    const root = document.querySelector(
        "#m7-profile-database-write-interruption-root");
    const status = document.querySelector(
        "#m7-profile-database-write-interruption-status");
    if (root instanceof HTMLElement) {
      root.dataset.state = "fail";
    }
    if (status instanceof HTMLElement) {
      status.textContent =
          "profile database write-interruption diagnostic failed; details suppressed";
    }
    throw error;
  });
</script>
