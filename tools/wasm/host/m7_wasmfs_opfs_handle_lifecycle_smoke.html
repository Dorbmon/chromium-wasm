<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Wasm M7 OPFS bounded handle-lifecycle smoke</title>
<main id="m7-opfs-handle-lifecycle-root" data-state="starting">
  <h1>Chromium Wasm M7 OPFS bounded handle-lifecycle smoke</h1>
  <pre id="m7-opfs-handle-lifecycle-status">starting</pre>
</main>
<script type="module">
  import {runM7WasmfsOpfsHandleLifecycleSmokeFromQuery} from
      "./m7_wasmfs_opfs_handle_lifecycle_smoke.js";
  runM7WasmfsOpfsHandleLifecycleSmokeFromQuery().catch((error) => {
    const root = document.querySelector("#m7-opfs-handle-lifecycle-root");
    const status = document.querySelector("#m7-opfs-handle-lifecycle-status");
    if (root instanceof HTMLElement) {
      root.dataset.state = "fail";
    }
    if (status instanceof HTMLElement) {
      status.textContent = String(error);
    }
    throw error;
  });
</script>
