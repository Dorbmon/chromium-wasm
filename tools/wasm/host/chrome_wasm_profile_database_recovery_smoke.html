<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Wasm M7 bounded profile database recovery probe</title>
<main id="m7-profile-database-recovery-root" data-state="starting">
  <h1>Chromium Wasm M7 bounded profile database recovery probe</h1>
  <dl id="m7-profile-database-recovery-versions"></dl>
  <canvas id="m7-profile-database-recovery-canvas" width="1" height="1"
      tabindex="0"
      aria-label="Chromium Wasm bounded profile database recovery probe canvas"></canvas>
  <pre id="m7-profile-database-recovery-status">starting</pre>
</main>
<script type="module">
  import {runChromeWasmProfileDatabaseRecoveryFromQuery} from
      "./chrome_wasm_profile_database_recovery_smoke.js";

  runChromeWasmProfileDatabaseRecoveryFromQuery().catch((error) => {
    const root = document.querySelector("#m7-profile-database-recovery-root");
    const status = document.querySelector("#m7-profile-database-recovery-status");
    if (root instanceof HTMLElement) {
      root.dataset.state = "fail";
    }
    if (status instanceof HTMLElement) {
      status.textContent = "bounded profile database recovery probe failed; details suppressed";
    }
    throw error;
  });
</script>
